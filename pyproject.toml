[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-brainstormer"
version = "0.1.0"
description = "Multi-agent system to analyze, critique, and tailor ATS-friendly CVs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CV-Brainstormer Team" }
]
dependencies = [
    "python-docx>=1.1.0",
    "weasyprint>=60.0",
    "markdown>=3.6",
    "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".agents",
    ".codex",
    ".git",
    ".pytest_cache",
    "output",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]
